<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="glass">
      <span class="brand">划词翻译</span>
      <span class="grow"></span>
      <button id="snipBtn" class="btn" title="框选屏幕区域，识别并翻译（Alt+S）">截屏</button>
      <button id="openWindow" class="btn" title="新开一个翻译窗口（可以开多个）">＋窗口</button>
      <button id="openReader" class="btn primary" title="新开一个 PDF 阅读器（可以开多个）">＋PDF</button>
      <button id="openOptions" class="btn" title="设置">设置</button>
    </header>

    <div class="langrow glass">
      <label for="targetLang">译为</label>
      <select id="targetLang"></select>
      <button id="swap" class="btn" title="在中英之间互换">⇄</button>
    </div>

    <textarea id="input" class="glass" placeholder="输入或粘贴要翻译的文本…"></textarea>

    <div class="row">
      <button id="translateBtn" class="btn primary grow">翻译</button>
      <button id="pasteBtn" class="btn">粘贴</button>
      <button id="clearBtn" class="btn">清空</button>
    </div>

    <div id="out" class="out glass empty">结果会显示在这里</div>

    <footer>
      网页上：<b>双击</b>选中即译 · <b>右键</b>菜单 · <b>Alt+T</b><br />
      图片/扫描件文字：<b>Alt+S</b> 框选截屏翻译
    </footer>
    <script src="popup.js" type="module"></script>
  </body>
</html>
